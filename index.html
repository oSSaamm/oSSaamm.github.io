<style>

        color: #f5dab3;
    }

</style>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script type="module">

import { data } from "./content.js"

const CURRENT_VERSION = "1.1.1.10"

function initUpdateSystem() {
    if (!localStorage.getItem("visited")) {
        localStorage.setItem("visited", "true")
    }

    const lastSeenVersion = localStorage.getItem("lastSeenVersion")

    if (lastSeenVersion !== CURRENT_VERSION) {
        showUpdateNotification()
    }
}

function showUpdateNotification() {
    const updateTab = Array.from(document.querySelectorAll(".tab"))
        .find(tab => tab.dataset.key.toLowerCase().includes("update"))

    if (!updateTab) {
        console.log("upd tab not found for sm reason")
        return
    }

    const badge = document.createElement("span")

    badge.textContent = "1"
    badge.style.marginLeft = "6px"
    badge.style.background = "#ffd400"
    badge.style.color = "#111"
    badge.style.borderRadius = "50%"
    badge.style.padding = "2px 6px"
    badge.style.fontSize = "12px"

    updateTab.appendChild(badge)

    updateTab.addEventListener("click", () => {
        localStorage.setItem("lastSeenVersion", CURRENT_VERSION)
        badge.remove()
    }, { once: true })
}

function showSoundPreview() {
    searchInput.parentElement.style.display = "none"

    contentEl.innerHTML = `
    <div id="sound-preview">
        <h2 style="color: #ffd400; margin-bottom: 30px;">🔊 Sound Preview</h2>

        <input type="text" id="sound-input" placeholder="Audio ID" maxlength="20" inputmode="numeric">

        <button id="find-btn">🔍 Find the sound</button>

        <div id="player-container">
            <audio id="audio-player" controls></audio>
            <div id="audio-info"></div>
        </div>
    </div>`

    const input = document.getElementById("sound-input")
    const findBtn = document.getElementById("find-btn")
    const playerContainer = document.getElementById("player-container")
    const audio = document.getElementById("audio-player")
    const info = document.getElementById("audio-info")

    input.addEventListener("input", () => {
        input.value = input.value.replace(/[^0-9]/g, "")
    })

    findBtn.onclick = () => {
        const num = input.value.trim()

        if (!num) {
            alert("❌ Numbers only son")
            return
        }

        playerContainer.style.display = "none"
        audio.src = ""

        const possibleExtensions = [".mp3", ".wav", ".ogg"]
        let found = false

        for (const ext of possibleExtensions) {
            const url = `/audio/${num}${ext}`

            fetch(url, { method: "HEAD" })
                .then(response => {
                    if (response.ok && !found) {
                        found = true
                        audio.src = url
                        playerContainer.style.display = "block"

                        audio.onloadedmetadata = () => {
                            info.textContent = `${num} Loaded | Duration: ${formatTime(audio.duration)}`
                        }
                    }
                })
                .catch(() => {
                    if (ext === ".ogg" && !found) {
                        alert(`❌ None of the sounds has ${num} as an ID!!`)
                    }
                })
        }
    }

    function formatTime(seconds) {
        if (!seconds || isNaN(seconds)) return "0:00"

        const min = Math.floor(seconds / 60)
        const sec = Math.floor(seconds % 60)

        return `${min}:${sec.toString().padStart(2, "0")}`
    }

    audio.addEventListener("timeupdate", () => {
        if (audio.duration) {
            info.textContent =
                `Audio ${input.value} | ${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`
        }
    })
}

const tabsEl = document.getElementById("tabs")
const contentEl = document.getElementById("content")
const searchInput = document.getElementById("search-input")

let highlights = []
let currentHighlightIndex = -1
let searchTimeout = null
let searchVersion = 0

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;")
}

function convertBold(text) {
    return text.replace(
        /\*\*(.*?)\*\*/g,
        '<span class="bold">$1</span>'
    )
}

function render(text) {
    const safe = escapeHtml(text)
    const withBold = convertBold(safe)

    contentEl.innerHTML = `<pre>${withBold}</pre>`
}

function performSearch(term) {
    if (!contentEl.dataset.raw) return

    const raw = contentEl.dataset.raw

    highlights = []
    currentHighlightIndex = -1

    if (!term || !term.trim()) {
        render(raw)
        return
    }

    const safe = escapeHtml(raw)

    const escapedTerm = term.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
    )

    const regex = new RegExp(`(${escapedTerm})`, "gi")

    const highlighted = convertBold(
        safe.replace(
            regex,
            '<span class="highlight">$1</span>'
        )
    )

    contentEl.innerHTML = `<pre>${highlighted}</pre>`

    highlights = Array.from(
        contentEl.querySelectorAll(".highlight")
    )

    currentHighlightIndex = highlights.length > 0 ? 0 : -1
}

function scrollToHighlight() {
    if (
        highlights.length === 0 ||
        currentHighlightIndex < 0
    ) {
        return
    }

    const highlight = highlights[currentHighlightIndex]

    highlight.scrollIntoView({
        behavior: "smooth",
        block: "center"
    })
}

function createTab(
    key,
    isVideoExtractor = false,
    isMessageMe = false,
    isPresets = false,
    isSoundPreview = false
) {
    const div = document.createElement("div")

    div.className = "tab"
    div.textContent = key
    div.dataset.key = key

    div.onclick = () => {
        document
            .querySelectorAll(".tab")
            .forEach(t => t.classList.remove("active"))

        div.classList.add("active")

        clearTimeout(searchTimeout)
        searchVersion++

        if (isPresets) {
            showPresets()
        } else if (isMessageMe) {
            showMessageMe()
        } else if (isVideoExtractor) {
            showVideoExtractor()
        } else if (isSoundPreview) {
            showSoundPreview()
        } else {
            const contentText =
                data[key] || "Content not found"

            contentEl.dataset.raw = contentText

            render(contentText)

            searchInput.value = ""
            searchInput.parentElement.style.display = "block"

            highlights = []
            currentHighlightIndex = -1
        }
    }

    tabsEl.appendChild(div)
}

function showPresets() {
    searchInput.parentElement.style.display = "none"

    contentEl.innerHTML = `
        <h2 style="color:#ffd400; text-align:center; margin-bottom:25px;">
            Presets
        </h2>

        <div id="presets-container"
             style="display:flex; flex-wrap:wrap; gap:12px; padding:10px;">
        </div>
    `

    const container =
        document.getElementById("presets-container")

    const presets = [
        { name: "Accurate M1", text: window.m1Preset },
        { name: "Mechamaru VFX", text: window.mechaPreset },
        { name: "Mangaka VFX", text: window.charlesPreset },
        { name: "Yuji VFX", text: window.yujiPreset },
        { name: "Naoya VFX", text: window.naoyaPreset },
        { name: "Ryu VFX", text: window.ryuPreset },
        { name: "Heian VFX", text: window.heianPreset },
        { name: "Nanami VFX", text: window.nanamiPreset },
        { name: "Megumi VFX", text: window.megumiPreset },
        { name: "Gojo VFX", text: window.gojoPreset },
        { name: "Hakari VFX", text: window.hakariPreset },
        { name: "Hanami VFX", text: window.hanamiPreset },
        { name: "Yuta VFX", text: window.yutaPreset },
        { name: "Higuruma VFX", text: window.higurumaPreset }
    ]

    presets.forEach(p => {
        const btn = document.createElement("button")

        btn.className = "preset-btn"
        btn.textContent = p.name

        btn.onclick = () => {
            navigator.clipboard.writeText(p.text).then(() => {
                const original = btn.textContent

                btn.textContent = "✓ Copied!"
                btn.style.background = "#0a0"

                setTimeout(() => {
                    btn.textContent = original
                    btn.style.background = ""
                }, 1500)
            })
        }

        container.appendChild(btn)
    })
}

function showMessageMe() {
    searchInput.parentElement.style.display = "none"

    contentEl.innerHTML = `
    <div style="max-width: 620px; margin: 40px auto; padding: 35px; background: #1a1a1a; border-radius: 16px; border: 1px solid #333;">

        <h2 style="color: #ffd400; text-align: center; margin-bottom: 30px; font-size: 28px;">
            💬 Message Me
        </h2>

        <div style="display:flex; gap:12px; align-items:stretch;">

            <div style="flex:1;">

                <input type="text"
                       id="discordUsername"
                       placeholder="Your Discord username (ex: osam#1234)"
                       style="width: 100%; padding: 16px; margin-bottom: 16px; background: #222; color: #fff; border: 1px solid #555; border-radius: 10px; font-size: 16px;">

                <textarea id="messageText"
                          placeholder="Write your message, suggestion, bug report or anything you want..."
                          style="width: 100%; min-height: 220px; padding: 16px; background: #222; color: #fff; border: 1px solid #555; border-radius: 10px; font-size: 16px; resize: vertical;"></textarea>

                <button id="sendMessageBtn"
                        style="width: 100%; padding: 18px; background: #ffd400; color: #111; border: none; border-radius: 10px; font-weight: bold; font-size: 17px; cursor: pointer; margin-top: 10px;">
                    Send Message
                </button>

            </div>

            <div style="width: 85px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:5px;">

                <div id="messageTimer"
                     style="font-size:14px; color:#aaa; min-height:20px; text-align:center;">
                </div>

                <div id="messageCounter"
                     style="font-size:18px; font-weight:bold; color:#ffd400; white-space:nowrap;">
                    6/6
                </div>

            </div>

        </div>

        <div id="status"
             style="margin-top: 15px; text-align: center; font-size: 15px; min-height: 24px;">
        </div>
    </div>`

    const usernameInput =
        document.getElementById("discordUsername")

    const messageInput =
        document.getElementById("messageText")

    const sendBtn =
        document.getElementById("sendMessageBtn")

    const statusEl =
        document.getElementById("status")

    const counterEl =
        document.getElementById("messageCounter")

    const timerEl =
        document.getElementById("messageTimer")

    let messagesLeft = 6
    let timerStarted = false
    let timerInterval = null
    let remainingSeconds = 60

    function updateCounter() {
        counterEl.textContent = `${messagesLeft}/6`

        if (messagesLeft <= 0) {
            sendBtn.disabled = true
            sendBtn.style.opacity = "0.45"
            sendBtn.style.cursor = "not-allowed"
        } else {
            sendBtn.disabled = false
            sendBtn.style.opacity = "1"
            sendBtn.style.cursor = "pointer"
        }
    }

    function startMessageTimer() {
        if (timerStarted) return

        timerStarted = true
        remainingSeconds = 60

        timerEl.textContent = "60s"

        timerInterval = setInterval(() => {
            remainingSeconds--

            timerEl.textContent = `${remainingSeconds}s`

            if (remainingSeconds <= 0) {
                clearInterval(timerInterval)
                timerInterval = null

                messagesLeft = 6
                timerStarted = false
                remainingSeconds = 60

                timerEl.textContent = ""

                updateCounter()
            }
        }, 1000)
    }

    updateCounter()

    sendBtn.onclick = async () => {
        const username = usernameInput.value.trim()
        const message = messageInput.value.trim()

        if (!username) {
            statusEl.style.color = "#ff6666"
            statusEl.textContent =
                "❌ Please enter your Discord username so i can warn you i did it"
            return
        }

        if (!message) {
            statusEl.style.color = "#ff6666"
            statusEl.textContent =
                "❌ gng i need a text to read"
            return
        }

        if (messagesLeft <= 0) {
            return
        }

        sendBtn.disabled = true
        sendBtn.textContent = "Sending..."

        statusEl.style.color = "#ffd400"
        statusEl.textContent = "Sending message..."

        try {
            const payload = {
                content:
                    `**New message from ${username}**\n\n${message}`
            }

            const res = await fetch(
                "https://webhookvault.lovable.app/api/public/relay/d02b95dae4f21c73ca991a9cf4c4f20cc726e4997fb74305",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                }
            )

            if (res.ok) {
                messagesLeft--

                if (!timerStarted) {
                    startMessageTimer()
                }

                updateCounter()

                statusEl.style.color = "#00ff88"
                statusEl.textContent = "✅ Message sent"

                messageInput.value = ""
            } else {
                statusEl.style.color = "#ff6666"
                statusEl.textContent = "❌ Failed to send. Try again bro"
            }

        } catch (err) {
            messagesLeft--

            if (!timerStarted) {
                startMessageTimer()
            }

            updateCounter()

            statusEl.style.color = "#00ff88"
            statusEl.textContent = "✅ Message sent"

            messageInput.value = ""
        }

        if (messagesLeft > 0) {
            sendBtn.disabled = false
        }

        sendBtn.textContent = "Send Message"
        updateCounter()

    }  

}



function showVideoExtractor() {
    searchInput.parentElement.style.display = "none"

    contentEl.innerHTML = `
    <div style="max-width: 740px; margin: 30px auto; padding: 35px; background: #1a1a1a; border-radius: 16px; border: 1px solid #333;">

        <h2 style="color: #ffd400; text-align: center; margin-bottom: 10px;">
            Video Frame Extractor
        </h2>

        <p style="text-align: center; color: #aaa; margin-bottom: 30px;">
            Extract all frames from a video at 24 fps (PNG + ZIP)
        </p>

        <input type="file"
               id="videoInput"
               accept="video/*"
               style="width: 100%; padding: 14px; background: #222; color: #ddd; border: 2px dashed #555; border-radius: 12px; cursor: pointer; margin-bottom: 25px;">

        <video id="preview"
               controls
               muted
               style="width: 100%; max-height: 440px; background: #000; border-radius: 12px; margin-bottom: 25px; display: none;">
        </video>

        <div style="display: flex; gap: 12px; flex-wrap: wrap;">

            <button id="startBtn"
                    style="flex: 1; padding: 16px; background: #ffd400; color: #111; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer;">
                ▶️ Start Extraction (24 fps)
            </button>

            <button id="downloadBtn"
                    disabled
                    style="flex: 1; padding: 16px; background: #ffd400; color: #111; border: none; border-radius: 10px; font-weight: bold; font-size: 16px;">
                ⬇️ Download ZIP
            </button>

        </div>

        <progress id="progress"
                  value="0"
                  max="100"
                  style="width: 100%; height: 14px; margin: 25px 0; border-radius: 999px; background: #333;">
        </progress>

        <div id="status"
             style="text-align: center; font-size: 15px; color: #aaa; min-height: 28px;">
            Select a video to begin
        </div>

    </div>`

    const videoInput =
        document.getElementById("videoInput")

    const preview =
        document.getElementById("preview")

    const startBtn =
        document.getElementById("startBtn")

    const downloadBtn =
        document.getElementById("downloadBtn")

    const progress =
        document.getElementById("progress")

    const status =
        document.getElementById("status")

    let frames = []
    let videoDuration = 0

    const fps = 24

    videoInput.onchange = e => {
        const file = e.target.files[0]

        if (!file) return

        const url = URL.createObjectURL(file)

        preview.src = url
        preview.style.display = "block"

        preview.onloadedmetadata = () => {
            videoDuration = preview.duration

            status.textContent =
                `✅ Video loaded — ${videoDuration.toFixed(1)} seconds`

            startBtn.disabled = false
        }
    }

    startBtn.onclick = async () => {
        startBtn.disabled = true
        downloadBtn.disabled = true

        frames = []

        status.textContent =
            "Extracting frames... (may take a while)"

        progress.value = 0

        const canvas =
            document.createElement("canvas")

        const ctx = canvas.getContext("2d")

        canvas.width =
            preview.videoWidth || 1280

        canvas.height =
            preview.videoHeight || 720

        const frameInterval = 1 / fps

        const totalFrames =
            Math.floor(videoDuration * fps) + 1

        let currentTime = 0
        let frameCount = 0

        async function extractNext() {
            if (currentTime > videoDuration) {
                status.textContent =
                    `Extracted ${frames.length} frames`

                downloadBtn.disabled =
                    frames.length === 0

                startBtn.disabled = false

                return
            }

            preview.currentTime = currentTime

            await new Promise(resolve => {
                preview.onseeked = () => {
                    setTimeout(() => {
                        try {
                            ctx.drawImage(
                                preview,
                                0,
                                0,
                                canvas.width,
                                canvas.height
                            )

                            canvas.toBlob(blob => {
                                if (blob) {
                                    const num =
                                        String(frameCount).padStart(5, "0")

                                    frames.push({
                                        name: `frame_${num}.png`,
                                        data: blob
                                    })

                                    frameCount++

                                    progress.value =
                                        (frameCount / totalFrames) * 100
                                }

                                currentTime += frameInterval

                                extractNext()
                            }, "image/png")
                        } catch (err) {
                            currentTime += frameInterval
                            extractNext()
                        }
                    }, 60)
                }
            })
        }

        extractNext()
    }

    downloadBtn.onclick = async () => {
        if (frames.length === 0) return

        downloadBtn.disabled = true
        status.textContent = "Creating ZIP..."

        const zip = new JSZip()

        for (let i = 0; i < frames.length; i++) {
            zip.file(
                frames[i].name,
                frames[i].data
            )
        }

        const content =
            await zip.generateAsync({ type: "blob" })

        const url =
            URL.createObjectURL(content)

        const a =
            document.createElement("a")

        a.href = url
        a.download = "frames.zip"
        a.click()

        URL.revokeObjectURL(url)

        status.textContent =
            "ZIP downloaded ✅"

        downloadBtn.disabled = false
    }
}

Object.keys(data).forEach(key => createTab(key))

createTab(
    "Presets",
    false,
    false,
    true
)

createTab(
    "Video Extractor",
    true
)

createTab(
    "Message Me",
    false,
    true
)

createTab(
    "Sound Preview",
    false,
    false,
    false,
    true
)

initUpdateSystem()

const firstTab =
    tabsEl.querySelector(".tab")

if (firstTab) {
    firstTab.click()
}

searchInput.addEventListener("input", e => {
    const term = e.target.value.trim()

    clearTimeout(searchTimeout)

    const version = ++searchVersion

    searchTimeout = setTimeout(() => {
        if (version !== searchVersion) return

        performSearch(term)
    }, 150)
})

searchInput.addEventListener("keydown", e => {
    if (e.key !== "Enter") return

    e.preventDefault()

    if (highlights.length === 0) return

    if (currentHighlightIndex === -1) {
        currentHighlightIndex = 0
    } else {
        currentHighlightIndex =
            (currentHighlightIndex + 1) % highlights.length
    }

    scrollToHighlight()
})  

</script>
